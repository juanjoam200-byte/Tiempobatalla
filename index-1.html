<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Batallas en - TikTok</title><style>html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;font-family:Arial,Helvetica,sans-serif}body{display:flex;align-items:center;justify-content:center}.panel{box-sizing:border-box;width:96%;max-width:900px;text-align:center;padding:16px 25px 20px;border-radius:22px;background:linear-gradient(120deg,rgba(15,9,39,.94),rgba(45,14,92,.92));border:2px solid #a855f7;box-shadow:0 0 24px #a855f777,inset 0 0 24px #a855f722;color:white}.label{font-size:clamp(16px,3.4vw,30px);font-weight:900;letter-spacing:2px;color:#e9d5ff;text-shadow:0 0 10px #a855f7}.time{font-size:clamp(38px,9vw,85px);font-weight:900;letter-spacing:3px;font-variant-numeric:tabular-nums;text-shadow:0 0 18px #c084fc}.sub{font-size:clamp(11px,1.7vw,16px);color:#c4b5fd;font-weight:bold}.active{animation:pulse 1.1s infinite alternate}.active .time{font-size:clamp(22px,5vw,46px)}@keyframes pulse{from{box-shadow:0 0 14px #a855f788;transform:scale(.99)}to{box-shadow:0 0 35px #d946ef;transform:scale(1.01)}}</style></head><body><div class="panel" id="panel"><div class="label" id="label">⚔️ NOS VAMOS A BATALLAS EN</div><div class="time" id="time">--:--:--</div><div class="sub" id="sub">02:00 · HORA DE ESPAÑA 🇪🇸</div></div><script>const zone='Europe/Madrid';function parts(date){const p=new Intl.DateTimeFormat('en-GB',{timeZone:zone,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(date);return Object.fromEntries(p.filter(x=>x.type!=='literal').map(x=>[x.type,+x.value]))}function offsetAt(ms){const p=parts(new Date(ms));return Date.UTC(p.year,p.month-1,p.day,p.hour,p.minute,p.second)-Math.floor(ms/1000)*1000}function madridToUTC(y,m,d,h){const local=Date.UTC(y,m-1,d,h);let guess=local-offsetAt(local);guess=local-offsetAt(guess);return guess}function tick(){const now=Date.now(),p=parts(new Date(now));const currentMins=p.hour*60+p.minute;const panel=document.getElementById('panel'),label=document.getElementById('label'),time=document.getElementById('time'),sub=document.getElementById('sub');if(currentMins>=120&&currentMins<180){panel.classList.add('active');label.textContent='🔥 ¡HORA DE BATALLAS! 🔥';time.textContent='¡VAMOS!';sub.textContent='GAMING TERMINADO · TOCAN BATALLAS';return}panel.classList.remove('active');label.textContent='⚔️ NOS VAMOS A BATALLAS EN';sub.textContent='02:00 · HORA DE ESPAÑA 🇪🇸';let y=p.year,m=p.month,d=p.day;if(currentMins>=180){const dt=new Date(Date.UTC(y,m-1,d+1));y=dt.getUTCFullYear();m=dt.getUTCMonth()+1;d=dt.getUTCDate()}const target=madridToUTC(y,m,d,2);let seconds=Math.max(0,Math.ceil((target-now)/1000));const h=Math.floor(seconds/3600);seconds%=3600;const min=Math.floor(seconds/60),sec=seconds%60;time.textContent=[h,min,sec].map(n=>String(n).padStart(2,'0')).join(':')}tick();setInterval(tick,500)</script></body></html>
